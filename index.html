<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso - Agenda de contactos</title>
    <!-- Enlazamos la hoja de estilos de la agenda -->
    <link rel="stylesheet" href="css/estilosAgenda.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-T5QW7J7f5aY5Q5h3gQWw7yJ5m3w7n3n2d5J5p5b5m5w5Q5h5g5Q5w5J5m5n5d5" crossorigin="anonymous">
    <link rel="icon" type="image/png" href="img/favicon.png">

</head>
<body>
    <header>
        <h1>Agenda de contactos</h1>
    </header>

    <main>
        <section>
            <h2>Login</h2>

            <!-- Formulario de login que envía los datos por POST a procesar_agenda.php Post porque se envían de forma segura -->
            <form method="post" action="procesos/procesar_agenda.php">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Ej: admin" required><br>
                
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Ej: 1234" required><br><br>

                <button type="submit">Iniciar sesión</button>
            </form>

        </section>
    </main>

    <footer>
        <p>2026 Agenda de contactos</p>
    </footer>
</body>
</html>
